name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static contracts
            history: 1
            command: >-
              pnpm --silent run repo -- platform generated check &&
              pnpm lint &&
              pnpm guard:canonical
          - name: Type safety
            history: 1
            command: pnpm typecheck
          - name: Tests
            history: 0
            command: >-
              pnpm test &&
              env DATABASE_URL="$AIR_JAM_CI_DATABASE_URL" pnpm --filter platform exec drizzle-kit migrate &&
              env AIR_JAM_TEST_DATABASE_URL="$AIR_JAM_CI_DATABASE_URL" node --test scripts/repo/runtime/operational-reliability-cli-contract.test.mjs &&
              env AIR_JAM_TEST_DATABASE_URL="$AIR_JAM_CI_DATABASE_URL" pnpm --filter platform test -- src/server/operations/operational-reliability-service.postgres.test.ts src/server/operations/operational-alert-issue-projection-service.postgres.test.ts src/server/operations/platform-schema-migration-run-service.postgres.test.ts src/server/operations/realtime-admission-migration.postgres.test.ts src/server/operations/realtime-admission-inspection-service.postgres.test.ts src/server/operations/production-budget-refresh-service.postgres.test.ts &&
              env AIR_JAM_TEST_DATABASE_URL="$AIR_JAM_CI_DATABASE_URL" pnpm --filter server test -- --run tests/operational-event-publisher.postgres.test.ts tests/auth-service.postgres.test.ts tests/realtime-admission-service.postgres.test.ts
            postgresImage: postgres:17-alpine
            databaseUrl: postgresql://postgres:postgres@localhost:5432/airjam_test
          - name: Workspace build
            history: 1
            command: pnpm build
          - name: Standalone deployment
            history: 1
            command: pnpm check:platform:deploy
          - name: Performance smoke
            history: 1
            command: >-
              pnpm --filter server... build &&
              pnpm run repo -- perf sanity --profile ci
    services:
      postgres:
        image: ${{ matrix.postgresImage || '' }}
        env:
          POSTGRES_DB: airjam_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airjam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIR_JAM_CI_DATABASE_URL: ${{ matrix.databaseUrl || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Only the test lane resolves immutable readiness evidence.
          fetch-depth: ${{ matrix.history }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  checks:
    name: checks
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify every confidence lane
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "One or more CI confidence lanes did not pass: $VALIDATION_RESULT"
            exit 1
          fi
